<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f2eb" />
    <title>Daymark — a little more done</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="Daymark home">
          <span class="wordmark-icon" aria-hidden="true">d.</span>
          <span>daymark</span>
        </a>
        <span class="topbar-note">A calmer kind of to-do list</span>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow"><span class="eyebrow-dot"></span> YOUR SPACE TO FOCUS</p>
        <h1 id="page-title">Make room for<br /><em>what matters.</em></h1>
        <p class="intro-copy">One small step at a time. Add a task, then move it along when you're ready.</p>
      </section>

      <section class="workspace" aria-label="Task manager">
        <form class="task-form" id="task-form">
          <label class="visually-hidden" for="task-title">Your next task</label>
          <span class="input-mark" aria-hidden="true">+</span>
          <input
            id="task-title"
            name="title"
            type="text"
            placeholder="What's on your mind?"
            autocomplete="off"
            maxlength="120"
          />
          <button class="add-button" type="submit">Add task <span aria-hidden="true">↗</span></button>
        </form>
        <p class="feedback" id="feedback" role="status" aria-live="polite"></p>

        <div class="list-heading">
          <h2>Your tasks</h2>
          <span class="list-caption">KEEP YOUR MOMENTUM</span>
        </div>

        <nav class="filters" aria-label="Filter tasks">
          <button class="filter-button is-active" type="button" data-status="all" aria-pressed="true">All</button>
          <button class="filter-button" type="button" data-status="todo" aria-pressed="false">To do</button>
          <button class="filter-button" type="button" data-status="in-progress" aria-pressed="false">In progress</button>
          <button class="filter-button" type="button" data-status="done" aria-pressed="false">Done</button>
        </nav>

        <ul class="task-list" id="task-list" aria-live="polite"></ul>
        <p class="empty-state" id="empty-state">Nothing here just yet. Add a task to get started.</p>
      </section>

      <footer class="footer">
        <span>Progress, not perfection.</span>
        <span class="footer-spark" aria-hidden="true">✳</span>
      </footer>
    </main>
  </body>
</html>
